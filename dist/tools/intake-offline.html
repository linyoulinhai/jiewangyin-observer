<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戒网瘾机构观察 · 离线投稿说明</title><style>body{font:16px/1.8 system-ui;max-width:760px;margin:24px auto;padding:0 18px;color:#20304a}h1{font-size:26px}label{display:block;margin:18px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #ccd5e0;border-radius:6px}textarea{min-height:150px}button{font:inherit;padding:10px 14px;border:1px solid #b3c5dd;border-radius:6px;background:#165ad5;color:white}p{overflow-wrap:anywhere}</style></head><body><h1>戒网瘾机构观察 · 离线整理</h1><p>整理戒网瘾、特训及封闭矫正机构的资料与来源。本页不联网、不提交、不打包原件。重要图片视频请另外保存；联网后将JSON导入网站，再选附件和确认提交范围。</p><form id="form"><label>机构名称或原资料编号<input name="institution" maxlength="150"></label><label>资料标题<input name="title" required maxlength="150"></label><label>背景、时间和不能确认的部分<textarea name="background" required maxlength="20000"></textarea></label><label>来源链接或取得方式<textarea name="source" maxlength="4000"></textarea></label><button>保存私人说明 JSON</button></form><p id="status" role="status"></p><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const data={format:'jiewangyin-intake-draft-v1',isSubmission:false,isPublic:false,createdAt:new Date().toISOString(),...Object.fromEntries(new FormData(e.target))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='戒网瘾机构资料-私人说明.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('status').textContent='已请求保存，尚未送达网站。原件请另外保留；浏览器或文件预览器可能不支持下载，需实际检查文件已保存。';};</script></body></html>
