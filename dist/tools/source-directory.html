=r;o.textContent=r;document.getElementById('region').append(o)}function draw(){const q=document.getElementById('q').value.trim().toLowerCase(),reg=document.getElementById('region').value;const filtered=rows.filter(r=>(!reg||r.region===reg)&&(!q||[r.name,r.alias,r.id].join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=filtered.length+'份来源记录；不是核实机构数量';document.getElementById('list').innerHTML=filtered.slice(0,limit).map(r=>'<article><small>'+esc(r.region)+' · '+esc(r.id)+' · 待核对</small><h2>'+esc(r.name)+'</h2><p>'+esc(r.alias||'原来源未提供别名')+'</p><a href="../index.html#institution/'+r.id+'">打开来源档案</a></article>').join('');document.getElementById('more').hidden=limit>=filtered.length}document.getElementById('q').oninput=()=>{limit=40;draw()};document.getElementById('region').onchange=()=>{limit=40;draw()};document.getElementById('more').onclick=()=>{limit+=40;draw()};draw();</script></html>
